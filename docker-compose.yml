services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_DB:-eventos}
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-eventos_user}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS:-eventos_pass}
    volumes:
      - mongo_data:/data/db
    networks:
      - soa_net

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: api
    depends_on:
      - mongo
      - rabbitmq
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8081}:8081"
    environment:
      MONGODB_URI: mongodb://${MONGO_USER:-eventos_user}:${MONGO_PASS:-eventos_pass}@mongo:27017/${MONGO_DB:-eventos}?authSource=admin
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_EXP_MIN: ${JWT_EXP_MIN:-15}
      APP_DATA_KEY: ${APP_DATA_KEY:-0123456789ABCDEF0123456789ABCDEF}
      INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      NOTIFY_EXCHANGE: ${NOTIFY_EXCHANGE:-eventos.notifications.exchange}
      NOTIFY_QUEUE: ${NOTIFY_QUEUE:-eventos.notifications.queue}
      NOTIFY_ROUTING_KEY: ${NOTIFY_ROUTING_KEY:-eventos.notifications.created}
      NOTIFY_ENABLED: ${NOTIFY_ENABLED:-true}
    networks:
      - soa_net

  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_PORT:-5672}:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    networks:
      - soa_net

  kong:
    image: kong:3.6
    container_name: kong
    depends_on:
      - api
    restart: unless-stopped
    environment:
      KONG_DATABASE: "off"                         # DB-less
      KONG_DECLARATIVE_CONFIG: "/etc/kong/kong.yml"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_LOG_LEVEL: notice
    ports:
      - "8000:8000"   # Proxy para el frontend
      - "8001:8001"   # Admin API (local)
    volumes:
      - ./kong/kong.yml:/etc/kong/kong.yml:ro
    networks:
      - soa_net

volumes:
  mongo_data:

networks:
  soa_net:
    driver: bridge
