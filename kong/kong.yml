_format_version: "3.0"

# ==========================
#  Declarative Kong Config
# ==========================

services:
  # Servicio principal que representa tu API Spring Boot
  - name: eventos-api
    url: http://api:8081
    routes:
      # Ruta para endpoints de eventos
      - name: eventos-route
        paths:
          - /api/eventos
        strip_path: false

      # Ruta para proveedores
      - name: proveedores-route
        paths:
          - /api/proveedores
        strip_path: false

      # Ruta para autenticación (login, registro)
      - name: auth-route
        paths:
          - /auth
        strip_path: false

      # Ruta para health check
      - name: health-route
        paths:
          - /health
        strip_path: false

      # Ruta adicional para /api/health (según tu controlador)
      - name: api-health-route
        paths:
          - /api/health
        strip_path: false

      # Ruta para usuarios (GET/POST /api/users, etc.)
      - name: users-route
        paths:
          - /api/users
        strip_path: false

      # Ruta para endpoint de sesión actual
      - name: me-route
        paths:
          - /api/me
        strip_path: false

      # Rutas para exponer Swagger UI y OpenAPI a través de Kong
      - name: swagger-ui-route
        paths:
          - /swagger-ui
        strip_path: false

      - name: openapi-docs-route
        paths:
          - /v3/api-docs
        strip_path: false

# ==========================
#  Plugins globales
# ==========================

plugins:
  - name: cors
    config:
      origins:
        - http://localhost:5173        # Vite dev
        - http://localhost:4173        # Vite preview / build local
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - Authorization
        - Content-Type
      credentials: true
      max_age: 3600
